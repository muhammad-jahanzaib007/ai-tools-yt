name: Publish (full pipeline)

# Fully automated: generate a brief, render the video, upload to YouTube.
# 2x/day (12:00 + 21:00 UTC = US morning and evening scroll). On demand too.
on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/publish-trigger.txt"

permissions:
  contents: write
  models: read

concurrency:
  group: yt-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Remotion deps (battle graphics)
        run: npm ci --prefix remotion

      - run: pip install --upgrade requests anthropic google-api-python-client google-auth google-auth-httplib2 librosa soundfile faster-whisper

      - name: Generate brief
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLOG_MODEL: ${{ vars.BLOG_MODEL || 'openai/gpt-4o-mini' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: python automation/generate_brief.py

      - name: Save brief
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add briefs automation/topics.json automation/latest.txt
          if ! git diff --cached --quiet; then
            git commit -m "brief: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Render video
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          VOICE_ID: ${{ vars.VOICE_ID }}
          ELEVEN_MODEL: ${{ vars.ELEVEN_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          VOICE_PROVIDER: ${{ vars.VOICE_PROVIDER }}
          GEMINI_VOICE: ${{ vars.GEMINI_VOICE }}
        run: python automation/render_video.py

      - name: Upload to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
          YT_CATEGORY: ${{ vars.YT_CATEGORY || '28' }}
        run: python automation/upload_video.py

      - name: Audio QA + record
        if: always()
        continue-on-error: true
        run: |
          python automation/audio_qa.py || true
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --quiet || true
          git add .github/last-audio-qa.txt 2>/dev/null || true
          git commit -m "audio qa" --quiet && git push --quiet || echo "nothing to record"
