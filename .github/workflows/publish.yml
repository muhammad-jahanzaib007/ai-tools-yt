name: Publish (full pipeline)

# Fully automated: generate a brief, render the video, upload to YouTube.
# 3x/day at UK times: 12:13 battle, 17:13 AI news, 21:13 Toolverse comic.
# Crons are UTC, set for BST (UK = UTC+1); after the October clock change
# these fire an hour early UK-side unless shifted back.
on:
  schedule:
    - cron: "13 11 * * *"
    - cron: "13 16 * * *"
    - cron: "13 20 * * *"
  workflow_dispatch:
    inputs:
      format:
        description: "battle|news|comic (blank = pick by clock)"
        required: false
        default: ""
  push:
    paths:
      - ".github/publish-trigger.txt"

permissions:
  contents: write
  models: read

concurrency:
  group: yt-publish
  cancel-in-progress: false

jobs:
  # A GitHub cron can be REPLAYED hours late (2026-07-06: the 11:13 slot
  # fired at 14:35 after a scheduler outage, duplicating a slot a manual
  # dispatch had already covered — the duplicate video had to be deleted by
  # hand). Skip a scheduled run when its own slot time has long passed AND
  # a video already published after that slot time. Manual dispatches and
  # trigger pushes are never blocked, and a merely-late cron whose slot was
  # NOT otherwise covered still runs.
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.dedupe.outputs.skip }}
    steps:
      - name: Detect a late-replayed cron slot
        id: dedupe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          skip=false
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            slot='${{ github.event.schedule }}'
            m=$(echo "$slot" | cut -d' ' -f1)
            h=$(echo "$slot" | cut -d' ' -f2)
            slot_ts=$(date -u -d "$(date -u +%F) ${h}:${m}:00" +%s)
            lag_min=$(( ( $(date -u +%s) - slot_ts ) / 60 ))
            echo "cron slot '$slot' fired ${lag_min} min after its slot time"
            if [ "$lag_min" -gt 90 ]; then
              last=$(gh api "repos/$GITHUB_REPOSITORY/commits?path=.github/last-upload.txt&per_page=1" \
                     --jq '.[0].commit.committer.date' 2>/dev/null || echo "")
              if [ -n "$last" ] && [ "$(date -u -d "$last" +%s)" -gt "$slot_ts" ]; then
                echo "a video already published after this slot's time - skipping the replay"
                skip=true
              fi
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  publish:
    needs: precheck
    if: needs.precheck.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # A hung API call must not hold the yt-publish concurrency group for
    # GitHub's 6h default and starve the next cron slot.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Remotion deps (battle graphics)
        run: npm ci --prefix remotion

      - run: pip install -r requirements.txt

      # Slot decides the format: midday = tool battle, late afternoon = AI news,
      # evening = Toolverse comic. A manually pushed trigger may force one by
      # putting "format=battle|news|comic" in publish-trigger.txt.
      # For a SCHEDULE run the format comes from the cron SLOT hour, not the
      # wall clock: GitHub can replay a cron hours late (2026-07-07 the 16:13
      # news slot fired at 18:20 and, read off the clock, produced a COMIC —
      # a second comic that day and no news). Deriving from the slot keeps a
      # late replay in its intended format (hard-won rule 2, format-flip).
      - name: Pick format by slot
        id: fmt
        run: |
          # BATTLE-ONLY consolidation (2026-07-08). The channel is pre-traction
          # (~25 views/28d); running 3 formats fragments the algorithm's
          # audience-building on a young channel. Focus on ONE format — tool
          # battles (real search demand + affiliate fit) — until it earns
          # distribution, THEN clone the winner (languages/formats).
          # This forces every run (cron, heartbeat dispatch, manual) to battle,
          # so the heartbeat's per-slot format inputs are moot while it is set.
          # TO RESTORE the 3-format rotation: set FORMAT_ONLY="" (one line).
          FORMAT_ONLY="battle"
          if [ -n "$FORMAT_ONLY" ]; then
            echo "format=$FORMAT_ONLY (battle-only mode)"
            echo "format=$FORMAT_ONLY" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ov=""
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            ov=$(grep -oiE "format=(battle|comic|news)" .github/publish-trigger.txt \
                 | head -1 | cut -d= -f2 | tr "A-Z" "a-z") || true
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # The heartbeat Worker (and manual dispatch) can pin the format so
            # a late external fire can't flip it off the wall clock.
            ov=$(echo "${{ inputs.format }}" | tr "A-Z" "a-z" | grep -oE "battle|comic|news") || true
          fi
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            # cron is "MIN HOUR * * *" — use the scheduled hour, not now().
            h=$(echo '${{ github.event.schedule }}' | cut -d' ' -f2)
          else
            h=$(date -u +%H)
          fi
          if [ -n "$ov" ]; then
            echo "format=$ov (trigger override)"
            echo "format=$ov" >> "$GITHUB_OUTPUT"
          elif [ "$h" -lt 15 ]; then
            echo "format=battle" >> "$GITHUB_OUTPUT"
          elif [ "$h" -lt 18 ]; then
            echo "format=news" >> "$GITHUB_OUTPUT"
          else
            echo "format=comic" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate brief
        id: brief
        env:
          FORMAT: ${{ steps.fmt.outputs.format }}
          HOOK_STYLE: ${{ vars.HOOK_STYLE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLOG_MODEL: ${{ vars.BLOG_MODEL || 'openai/gpt-4o-mini' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        # tee the log so Record status can commit the error tail on failure
        # (the 2026-07-05 news/comic failures left no readable trace: job logs
        # need admin, and this step wrote nothing to the receipt).
        run: |
          set -o pipefail
          python automation/generate_brief.py 2>&1 | tee /tmp/brief.log

      - name: Save brief
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add briefs automation/topics.json automation/latest.txt automation/universe.json
          if ! git diff --cached --quiet; then
            git commit -m "brief: $(date -u +%Y-%m-%d)"
            # Rebase + retry: a concurrent push to main must not fail the whole pipeline.
            ok=""
            for i in 1 2 3; do
              if git pull --rebase --quiet && git push; then ok=1; break; fi
              echo "push attempt $i rejected, retrying"
              sleep 5
            done
            [ -n "$ok" ] || { echo "brief push failed after 3 attempts"; exit 1; }
          fi

      - name: Render video
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          VOICE_ID: ${{ vars.VOICE_ID }}
          ELEVEN_MODEL: ${{ vars.ELEVEN_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          VOICE_PROVIDER: ${{ vars.VOICE_PROVIDER }}
          GEMINI_VOICE: ${{ vars.GEMINI_VOICE }}
        run: python automation/render_video.py

      # Gate BEFORE publishing: abort on silent/garbled audio so a broken video
      # never reaches YouTube/IG/FB/TikTok. Peak + monotone stay advisory.
      - name: Audio QA gate
        run: python automation/audio_qa.py --gate

      - name: Upload to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
          YT_CATEGORY: ${{ vars.YT_CATEGORY || '28' }}
        run: python automation/upload_video.py

      # Optional cross-post to IG/FB Reels. No-ops (exit 0) until Meta secrets exist.
      - name: Cross-post to Instagram + Facebook Reels
        continue-on-error: true
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          CROSSPOST_TARGETS: ${{ vars.CROSSPOST_TARGETS || 'ig,fb' }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY || 'SELF_ONLY' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python automation/crosspost.py

      - name: Record status
        if: always()
        continue-on-error: true
        run: |
          python automation/audio_qa.py || true   # refresh telemetry post-upload
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --quiet || true
          # A failed brief step leaves its error tail in the receipt so the
          # reason is readable via git alone (job logs need admin).
          if [ "${{ steps.brief.outcome }}" = "failure" ] && [ -f /tmp/brief.log ]; then
            { echo "$(date -u +%FT%TZ) failure (publish run)"; echo "--- log tail ---"
              tail -c 1500 /tmp/brief.log; } > .github/last-brief.txt
          fi
          # Add each receipt individually: one missing pathspec in a combined
          # `git add a b c` fails the WHOLE add (nothing staged), which silently
          # dropped all receipts when playlists.json didn't exist (2026-07-05).
          for f in .github/last-brief.txt .github/last-audio-qa.txt .github/last-upload.txt .github/last-crosspost.txt automation/playlists.json; do
            [ -f "$f" ] && git add "$f"
          done
          # Retry the push: a lost race here silently drops the receipts, and
          # the watchdog then misreads the stale receipt as a dead slot.
          if git commit -m "audio qa" --quiet; then
            ok=""
            for i in 1 2 3; do
              if git push --quiet; then ok=1; break; fi
              echo "push attempt $i rejected; rebasing"
              git pull --rebase --quiet || true
              sleep 5
            done
            [ -n "$ok" ] || { echo "receipt push failed after 3 attempts"; exit 1; }
          else
            echo "nothing to record"
          fi
