name: Publish (full pipeline)

# Fully automated: generate a brief, render the video, upload to YouTube.
# 3x/day at UK times: 11:59, 16:59, 20:59 (UTC 10:59/15:59/19:59).
#
# SINGLE FIRING SOURCE (2026-07-11): NO `schedule:` crons here. GitHub's
# scheduler fires late, replays hours later, and skips days — two firing
# sources (cron + heartbeat) racing each other double-published 3 slots in
# 36 hours. The Cloudflare heartbeat Worker (heartbeat/worker.js) is now the
# ONLY thing that fires this workflow on a schedule; it dispatches at the
# exact slot minute and retries via :20/:40 sweeps. Do NOT re-add crons —
# slot times live in heartbeat/wrangler.toml + worker.js SLOTS.
on:
  workflow_dispatch:
    inputs:
      format:
        description: "battle|news|comic (blank = pick by clock)"
        required: false
        default: ""
  push:
    paths:
      - ".github/publish-trigger.txt"

permissions:
  contents: write
  models: read

concurrency:
  group: yt-publish
  cancel-in-progress: false

jobs:
  # SAFETY NET ONLY: with schedule crons removed (single firing source =
  # heartbeat Worker) this never triggers. It stays so that if anyone ever
  # re-adds a cron, a late replay still skips itself when ANY other publish
  # run was created at/after its slot time (this exact race double-published
  # 3 slots on 2026-07-10/11). Manual dispatches and trigger pushes are
  # never blocked.
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.dedupe.outputs.skip }}
    steps:
      - name: Skip a cron whose slot another run already covers
        id: dedupe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          skip=false
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            slot='${{ github.event.schedule }}'
            m=$(echo "$slot" | cut -d' ' -f1)
            h=$(echo "$slot" | cut -d' ' -f2)
            slot_ts=$(date -u -d "$(date -u +%F) ${h}:${m}:00" +%s)
            lag_min=$(( ( $(date -u +%s) - slot_ts ) / 60 ))
            echo "cron slot '$slot' fired ${lag_min} min after its slot time"
            slot_iso=$(date -u -d "@${slot_ts}" +%FT%TZ)
            others=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/publish.yml/runs?per_page=20" \
                     --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }} and .created_at >= \"$slot_iso\")] | length" \
                     2>/dev/null || echo 0)
            if [ "${others:-0}" -gt 0 ]; then
              echo "slot already covered by ${others} other run(s) since ${slot_iso} - skipping"
              skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  publish:
    needs: precheck
    if: needs.precheck.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # A hung API call must not hold the yt-publish concurrency group for
    # GitHub's 6h default and starve the next cron slot.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Remotion deps (battle graphics)
        run: npm ci --prefix remotion

      - run: pip install -r requirements.txt

      # FORMAT PIVOT 2026-07-23 (ab29dac) set format=insight as the default
      # for every slot the SAME DAY this session started iterating the
      # insight format's visuals with the owner (b-roll -> typography-only ->
      # keyword-images v1-v7, several rejected/reworked live in this
      # conversation). Owner was not aware production had already switched
      # over mid-iteration ("why are new format videos publishing even
      # though I didn't pass it yet") - real videos in intermediate,
      # unapproved visual states were shipping to the channel this whole
      # time. PAUSED BACK to the pre-pivot battle/ranking split (insight
      # code/topics untouched, still reachable via explicit format=insight
      # override for controlled testing) until the owner explicitly signs
      # off on a final insight visual state.
      - name: Pick format by slot
        id: fmt
        run: |
          ov=""
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            ov=$(grep -oiE "format=(insight|battle|ranking|comic|news)" .github/publish-trigger.txt \
                 | head -1 | cut -d= -f2 | tr "A-Z" "a-z") || true
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # The heartbeat Worker (and manual dispatch) can pin the format so
            # a late external fire can't flip it off the wall clock.
            ov=$(echo "${{ inputs.format }}" | tr "A-Z" "a-z" | grep -oE "insight|battle|ranking|comic|news") || true
          fi
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            # cron is "MIN HOUR * * *" - use the scheduled hour, not now().
            h=$(echo '${{ github.event.schedule }}' | cut -d' ' -f2)
          else
            h=$(date -u +%H)
          fi
          if [ -n "$ov" ]; then
            echo "format=$ov (trigger override)"
            echo "format=$ov" >> "$GITHUB_OUTPUT"
          elif [ "$h" -lt 15 ]; then
            echo "format=battle" >> "$GITHUB_OUTPUT"
          else
            echo "format=ranking" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate brief
        id: brief
        env:
          FORMAT: ${{ steps.fmt.outputs.format }}
          HOOK_STYLE: ${{ vars.HOOK_STYLE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLOG_MODEL: ${{ vars.BLOG_MODEL || 'openai/gpt-4o-mini' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        # tee the log so Record status can commit the error tail on failure
        # (the 2026-07-05 news/comic failures left no readable trace: job logs
        # need admin, and this step wrote nothing to the receipt).
        run: |
          set -o pipefail
          python automation/generate_brief.py 2>&1 | tee /tmp/brief.log

      - name: Save brief
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add briefs automation/topics.json automation/latest.txt automation/universe.json
          if ! git diff --cached --quiet; then
            git commit -m "brief: $(date -u +%Y-%m-%d)"
            # Rebase + retry: a concurrent publish run must not fail the pipeline.
            # `-X theirs` auto-resolves conflicts in the pointer/ledger files
            # (latest.txt, topics.json, universe.json) in favour of THIS run's
            # brief, so two runs racing to write latest.txt no longer deadlock
            # the loop (the old `git pull --rebase` left a stuck rebase whose
            # "unmerged files" state failed every subsequent retry). Unique
            # brief filenames never conflict. Abort any half-finished rebase
            # before retrying so the loop always starts clean.
            ok=""
            for i in 1 2 3 4 5; do
              if git pull --rebase -X theirs --quiet && git push --quiet; then ok=1; break; fi
              echo "push attempt $i rejected; cleaning up + retrying"
              git rebase --abort 2>/dev/null || true
              git merge  --abort 2>/dev/null || true
              sleep 5
            done
            [ -n "$ok" ] || { echo "brief push failed after 5 attempts"; exit 1; }
          fi

      - name: Render video
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          VOICE_ID: ${{ vars.VOICE_ID }}
          ELEVEN_MODEL: ${{ vars.ELEVEN_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          VOICE_PROVIDER: ${{ vars.VOICE_PROVIDER }}
          GEMINI_VOICE: ${{ vars.GEMINI_VOICE }}
        run: python automation/render_video.py

      # Gate BEFORE publishing: abort on silent/garbled audio so a broken video
      # never reaches YouTube/IG/FB/TikTok. Peak + monotone stay advisory.
      - name: Audio QA gate
        run: python automation/audio_qa.py --gate

      - name: Upload to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
          YT_CATEGORY: ${{ vars.YT_CATEGORY || '28' }}
        run: python automation/upload_video.py

      # Optional cross-post to IG/FB Reels. No-ops (exit 0) until Meta secrets exist.
      - name: Cross-post to Instagram + Facebook Reels (+ stage for manual TikTok upload)
        continue-on-error: true
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          CROSSPOST_TARGETS: ${{ vars.CROSSPOST_TARGETS || 'ig,fb,tt' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python automation/crosspost.py

      - name: Record status
        if: always()
        continue-on-error: true
        run: |
          python automation/audio_qa.py || true   # refresh telemetry post-upload
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # NOTE: no pre-commit `git pull --rebase` here - audio_qa.py above
          # dirties the tree with fresh receipts, so a rebase would abort on
          # "cannot pull with rebase: You have unstaged changes" (swallowed,
          # but noisy + dead). The post-commit retry loop below rebases on a
          # clean tree instead, which is the mechanism that actually works.
          # A failed brief step leaves its error tail in the receipt so the
          # reason is readable via git alone (job logs need admin).
          if [ "${{ steps.brief.outcome }}" = "failure" ] && [ -f /tmp/brief.log ]; then
            { echo "$(date -u +%FT%TZ) failure (publish run)"; echo "--- log tail ---"
              tail -c 1500 /tmp/brief.log; } > .github/last-brief.txt
          fi
          # Add each receipt individually: one missing pathspec in a combined
          # `git add a b c` fails the WHOLE add (nothing staged), which silently
          # dropped all receipts when playlists.json didn't exist (2026-07-05).
          for f in .github/last-brief.txt .github/last-audio-qa.txt .github/last-upload.txt .github/last-crosspost.txt automation/playlists.json automation/tiktok_manual_queue.json; do
            [ -f "$f" ] && git add "$f"
          done
          # Retry the push: a lost race here silently drops the receipts, and
          # the watchdog then misreads the stale receipt as a dead slot.
          if git commit -m "audio qa" --quiet; then
            ok=""
            for i in 1 2 3 4 5; do
              if git push --quiet; then ok=1; break; fi
              echo "push attempt $i rejected; rebasing"
              # -X theirs + abort-on-fail: same conflict-recovery fix as Save
              # brief (a stuck rebase used to fail every later retry here too).
              git pull --rebase -X theirs --quiet || { git rebase --abort 2>/dev/null || true; }
              sleep 5
            done
            [ -n "$ok" ] || { echo "receipt push failed after 5 attempts"; exit 1; }
          else
            echo "nothing to record"
          fi
