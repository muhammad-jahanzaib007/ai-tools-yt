name: Tests

# Pure-function tests for the automation scripts (JSON extraction, brief
# validation, take scoring, news helpers). Runs on any code push so a broken
# edit is caught before the next publish cron, not by it — the 2026-07-05
# outage was a hand-edit that a 30-second import test would have caught.
on:
  push:
    paths:
      - "automation/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install the REAL dependency set, not a hand-picked subset. The subset
      # (pytest+requests) silently drifted out of date as modules gained
      # module-level imports: numpy via audio_qa, then google-api-python-client
      # via upload_video. The suite died at COLLECTION on every push from
      # 2026-07-23 onward - 6+ silent red runs, which is how a stale test
      # signature survived the insight go-live. A subset saves ~60s and costs
      # the entire safety net; numpy is pulled in as librosa's dependency.
      - run: pip install -r requirements.txt pytest==9.1.1

      - run: python -m pytest tests -q
