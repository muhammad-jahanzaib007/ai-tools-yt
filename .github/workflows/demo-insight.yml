name: Demo insight videos (preview only, no publish)

# One-off: render N real "insight" format videos for the owner to watch
# before this format goes live. Script via Claude (ANTHROPIC_API_KEY); voice
# via free edge-tts (VOICE_PROVIDER=edge) so this preview spends ZERO Gemini
# quota. No upload, no crosspost, no push - artifacts only. Delete once the
# format is approved and shipping for real.
on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many demo videos to render"
        default: "3"

# GitHub Models (the old free script fallback) is being retired (410 brownout
# 2026-07-23), so briefs use Claude here instead. contents:read is for checkout.
permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    # Each insight render is ~10 min on CI (edge-tts + Whisper word-alignment +
    # ~1200-frame Remotion render), so 3 demos need well over the old 25 min.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Remotion deps (insight graphics)
        run: npm ci --prefix remotion

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Render N insight demos (edge-tts, no Gemini quota)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
          VOICE_PROVIDER: edge
          FORMAT: insight
        run: |
          set -e
          n="${{ inputs.count || '3' }}"
          mkdir -p demo_output
          for i in $(seq 1 "$n"); do
            echo "=== demo $i/$n ==="
            python automation/generate_brief.py
            python automation/render_video.py
            slug=$(cat automation/latest.txt)
            cp "output/${slug}.mp4" "demo_output/${i}_${slug}.mp4"
          done
          ls -la demo_output

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: insight-demos
          path: demo_output/*.mp4
          retention-days: 3
          if-no-files-found: ignore
