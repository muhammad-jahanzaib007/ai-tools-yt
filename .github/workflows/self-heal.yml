name: Self-heal

# Retries in-domain publish FAILURES; humans are only pulled in for
# out-of-domain problems (credentials, quota, billing).
#
# A failed publish run is retried once — transient flakes (LLM hiccups,
# network, API blips) usually clear on retry. A second failure opens ONE
# labelled issue, titled needs-human when the receipt smells like
# credentials/quota.
#
# NOTE: the old schedule "backstop" (re-dispatch a missed slot) was RETIRED
# 2026-07-08 — the external Cloudflare heartbeat (heartbeat/) now covers
# missed slots, and it does so per-slot (only inside a slot's window, and
# only if that slot has no run), so it does not over-fire. The backstop's
# cruder "no run in the last 100 min" heuristic over-fired on 2026-07-08
# (a late-replayed 12:48 cron dispatched an extra video at 15:00 even though
# the slot was already covered). One dispatch source for missed slots — the
# heartbeat — is enough, and it survives a GitHub scheduler outage (an
# in-repo cron backstop does not).
on:
  workflow_run:
    workflows: ["Publish (full pipeline)"]
    types: [completed]

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: self-heal
  cancel-in-progress: false

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retry a failed publish once, escalate a repeat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          if [ "$CONCLUSION" != "failure" ]; then
            echo "publish concluded: $CONCLUSION; nothing to heal"
            exit 0
          fi
          if [ "$ATTEMPT" -lt 2 ]; then
            echo "retrying failed publish run $RUN_ID (was attempt $ATTEMPT)"
            gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
            exit 0
          fi
          echo "publish failed twice; escalating"
          tail=$(curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/.github/last-brief.txt" || echo "(no receipt)")
          title="Self-heal: publish failed twice, retry did not fix it"
          if printf '%s' "$tail" | grep -qiE "401|403|invalid_grant|unauthorized|insufficient|billing|suspended|quota|expired"; then
            title="Self-heal: publish NEEDS A HUMAN (credentials/quota class)"
          fi
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label watchdog --state open --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "watchdog issue already open; not duplicating"
            exit 0
          fi
          gh label create watchdog --repo "$GITHUB_REPOSITORY" \
            --description "automated pipeline health alert" --color D93F0B 2>/dev/null || true
          gh issue create --repo "$GITHUB_REPOSITORY" --label watchdog \
            --title "$title" \
            --body "$(printf 'Publish failed on both attempts: %s\n\nLast brief receipt:\n```\n%s\n```\n' "$RUN_URL" "$tail")"
