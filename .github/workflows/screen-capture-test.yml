name: Screen-capture demo test (cloud-IP diagnostic)

# Manual-only diagnostic. perchance.org was blocked from a GitHub Actions
# cloud IP (Cloudflare Turnstile, 2026-07-22) - never proven the CONFIRMED
# WORKING tool (imgupscaler.ai) from a cloud IP specifically, only from the
# owner's residential IP. If this passes, capture_batch.py can just run as
# an ordinary scheduled/dispatched GH Actions workflow with the repo's
# existing secrets - no self-hosted runner, no owner's-PC dependency at
# all. If it's blocked here too, the owner's-PC path is still the fallback.
# QUOTA CAUTION: imgupscaler's free tier is a shared per-IP credit pool -
# do not re-dispatch this repeatedly (see screen_capture.py's quota caveat).
on:
  workflow_dispatch:

jobs:
  test-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Playwright
        run: |
          pip install playwright requests
          python -m playwright install --with-deps chromium

      - name: Run capture batch (count 1, cloud-IP test)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python automation/capture_batch.py --count 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-test-output
          path: |
            automation/capture_library.json
            .render/**/*.debug.png
          if-no-files-found: warn
          retention-days: 3
