name: Generate character art (Toolverse)

# Idempotent batch: generates any missing hero/villain art via Gemini image
# generation and commits it. Fire by bumping .github/art-trigger.txt.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/art-trigger.txt"

permissions:
  contents: write

concurrency:
  group: toolverse-art
  cancel-in-progress: false

jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --upgrade requests

      - name: Generate missing art
        env:
          ART_PROVIDER: ${{ vars.ART_PROVIDER }}
          ART_LIMIT: ${{ vars.ART_LIMIT }}
          ART_HEROES_ONLY: ${{ vars.ART_HEROES_ONLY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
          OPENAI_IMAGE_QUALITY: ${{ vars.OPENAI_IMAGE_QUALITY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          POLLINATIONS_MODEL: ${{ vars.POLLINATIONS_MODEL }}
        run: python automation/make_character_art.py

      - name: Commit art
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/toolverse .github/last-art.txt
          if git diff --cached --quiet; then
            echo "No new art."
          else
            git commit -m "art: Toolverse characters"
            # Rebase + retry: a concurrent push to main must not throw away a
            # whole (paid) generation batch. Same fix as publish.yml Save brief.
            for i in 1 2 3; do
              git pull --rebase --quiet && git push && break
              echo "push attempt $i rejected, retrying"
              sleep 5
            done
          fi
