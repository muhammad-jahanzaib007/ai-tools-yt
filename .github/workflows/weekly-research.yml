name: Weekly research (trends + analytics)

# Sundays 08:00 UK (07:00 UTC during BST): refresh niche trend data (feeds
# topic replenishment) and generate the channel analytics report.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 0"

permissions:
  contents: write

concurrency:
  group: yt-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Trend research (Data API, key only)
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python automation/trend_research.py

      - name: Analytics report
        # continue-on-error so a dead analytics token never blocks the trend
        # data (which feeds topic replenishment). 2026-09-17: that tolerance
        # hid a 10-week outage - the step crashed every Sunday with
        # "invalid_scope" while the run still reported SUCCESS, so nobody
        # noticed analytics/latest.md had been frozen since 2026-07-05. The
        # receipt step below now records the outcome and watchdog.yml alerts
        # on it, so the next silent failure is visible within a day.
        id: analytics
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          set -o pipefail
          python automation/analytics_report.py 2>&1 | tee /tmp/analytics.log

      - name: Analytics receipt
        if: always()
        run: |
          ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [ "${{ steps.analytics.outcome }}" = "success" ]; then
            echo "$ts ok" > .github/last-analytics.txt
          else
            {
              echo "$ts FAIL analytics_report.py"
              tail -n 12 /tmp/analytics.log 2>/dev/null || echo "(no log captured)"
            } > .github/last-analytics.txt
          fi
          cat .github/last-analytics.txt

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add automation/trends.json analytics .github/last-analytics.txt || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "research: $(date -u +%Y-%m-%d) trends + analytics"
            # Rebase + retry: a concurrent push to main must not fail the run.
            ok=""
            for i in 1 2 3; do
              if git push; then ok=1; break; fi
              echo "push attempt $i rejected; rebasing"
              git pull --rebase --quiet || true
              sleep 5
            done
            [ -n "$ok" ] || { echo "research push failed after 3 attempts"; exit 1; }
          fi
