name: Render video (Phase 2)

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Brief slug to render (leave blank for the newest)"
        required: false
  push:
    paths:
      - ".github/render-trigger.txt"

permissions:
  contents: write

concurrency:
  group: yt-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Remotion deps (battle graphics)
        run: npm ci --prefix remotion

      - run: pip install --upgrade requests librosa soundfile

      - name: Render video
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          VOICE_ID: ${{ vars.VOICE_ID }}
          ELEVEN_MODEL: ${{ vars.ELEVEN_MODEL }}
          BRIEF_SLUG: ${{ inputs.slug }}
        run: python automation/render_video.py

      - name: Audio QA (voice expressiveness + mix)
        continue-on-error: true
        run: python automation/audio_qa.py

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            output/*.mp4
            output/*.jpg
          if-no-files-found: error
          retention-days: 14

      # The repo is private, so run results can't be watched via the public
      # API; a tiny committed status line makes them checkable with git alone.
      - name: Record render status
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --quiet || true
          out=$(ls output/*.mp4 2>/dev/null | head -1)
          secs=""
          if [ -n "$out" ]; then
            secs=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$out" 2>/dev/null | cut -d. -f1)
          fi
          echo "$(date -u +%FT%TZ) ${{ job.status }} ${out:-no-output} ${secs:+${secs}s}" > .github/last-render.txt
          git add .github/last-render.txt
          git add .github/last-audio-qa.txt 2>/dev/null || true
          git commit -m "render status" --quiet && git push --quiet || echo "nothing to record"
