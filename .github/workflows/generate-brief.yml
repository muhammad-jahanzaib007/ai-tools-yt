name: Generate video brief (Phase 1)

# Free: uses GitHub Models via the built-in GITHUB_TOKEN. No API key.
# Manual for now (Run workflow). The schedule is added in Phase 3 with render + upload.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/trigger.txt"

permissions:
  contents: write
  models: read

concurrency:
  group: yt-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # trigger.txt containing "news" fires a daily AI-news brief; "comic" a
      # Toolverse episode; anything else a battle.
      - name: Pick format
        id: fmt
        run: |
          if grep -qi news .github/trigger.txt 2>/dev/null; then
            echo "format=news" >> "$GITHUB_OUTPUT"
          elif grep -qi comic .github/trigger.txt 2>/dev/null; then
            echo "format=comic" >> "$GITHUB_OUTPUT"
          else
            echo "format=battle" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate brief
        env:
          FORMAT: ${{ steps.fmt.outputs.format }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLOG_MODEL: ${{ vars.BLOG_MODEL || 'openai/gpt-4o-mini' }}
          # Optional: add an ANTHROPIC_API_KEY secret to use Claude instead of free GitHub Models.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: |
          set -o pipefail
          python automation/generate_brief.py 2>&1 | tee /tmp/brief.log

      - name: Upload brief as artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-brief
          path: briefs/*.json

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add briefs automation/topics.json automation/latest.txt automation/universe.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "brief: $(date -u +%Y-%m-%d)"
            # Rebase + retry: a concurrent push to main must not fail the run.
            ok=""
            for i in 1 2 3; do
              if git push; then ok=1; break; fi
              echo "push attempt $i rejected; rebasing"
              git pull --rebase --quiet || true
              sleep 5
            done
            [ -n "$ok" ] || { echo "brief push failed after 3 attempts"; exit 1; }
          fi

      # Job logs need admin auth, so failures are recorded as a committed
      # status line readable with git alone.
      - name: Record status
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --quiet || true
          echo "$(date -u +%FT%TZ) ${{ job.status }} brief=$(cat automation/latest.txt 2>/dev/null)" > .github/last-brief.txt
          # On failure, append the log tail so the reason is readable via git
          # (anonymous API cannot fetch Actions job logs).
          if [ "${{ job.status }}" != "success" ] && [ -f /tmp/brief.log ]; then
            echo "--- log tail ---" >> .github/last-brief.txt
            tail -c 1500 /tmp/brief.log >> .github/last-brief.txt
          fi
          git add .github/last-brief.txt
          if git commit -m "brief status" --quiet; then
            ok=""
            for i in 1 2 3; do
              if git push --quiet; then ok=1; break; fi
              echo "push attempt $i rejected; rebasing"
              git pull --rebase --quiet || true
              sleep 5
            done
            [ -n "$ok" ] || { echo "receipt push failed after 3 attempts"; exit 1; }
          else
            echo "nothing to record"
          fi
