<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1024px;height:1024px;overflow:hidden}
  body{background:#D97757;display:grid;place-items:center}
  .wrap{position:relative;width:760px;height:760px;display:grid;place-items:center}
  .burst{position:absolute;inset:0;border-radius:50%;
    background:repeating-conic-gradient(from 7.5deg,#F4F1EA 0deg 3.2deg,transparent 3.2deg 30deg);
    -webkit-mask:radial-gradient(circle, transparent 0 9%, #000 13% 46%, transparent 51%);
            mask:radial-gradient(circle, transparent 0 9%, #000 13% 46%, transparent 51%)}
  .core{width:150px;height:150px;border-radius:50%;background:#F4F1EA;
    box-shadow:0 6px 24px rgba(120,50,30,.25)}
</style></head>
<body>
  <div class="wrap">
    <div class="burst"></div>
    <div class="core"></div>
  </div>
</body></html>
