<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:2560px;height:1440px;overflow:hidden}
  body{position:relative;font-family:'Segoe UI',Arial,sans-serif;
    background:radial-gradient(80% 120% at 50% 30%,#13234f 0%,#0a0f24 55%,#05070f 100%)}
  .grid{position:absolute;inset:0;opacity:.10;
    background-image:linear-gradient(#9fb4ff 1px,transparent 1px),linear-gradient(90deg,#9fb4ff 1px,transparent 1px);
    background-size:80px 80px;mask:radial-gradient(70% 70% at 50% 50%,#000,transparent)}
  .glow{position:absolute;width:1200px;height:1200px;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(99,102,241,.35),transparent 60%);filter:blur(30px)}
  /* everything important sits inside the 1546x423 TV-safe centre area */
  .safe{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:1546px;height:423px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px}
  .pill{display:inline-flex;align-items:center;gap:14px;
    border:1px solid rgba(159,180,255,.35);background:rgba(99,102,241,.12);
    padding:10px 24px;border-radius:999px;font-size:26px;letter-spacing:3px;color:#bcd0ff;font-weight:600}
  .dot{width:14px;height:14px;border-radius:50%;background:#22d3ee;box-shadow:0 0 16px #22d3ee}
  h1{font-size:150px;font-weight:800;letter-spacing:2px;line-height:1;
    background:linear-gradient(100deg,#ffffff 30%,#a855f7 70%,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{font-size:40px;color:#c7d2ff;font-weight:500;letter-spacing:1px}
</style></head>
<body>
  <div class="grid"></div><div class="glow"></div>
  <div class="safe">
    <span class="pill"><span class="dot"></span>NEW AI TOOLS &amp; NEWS, EVERY WEEK</span>
    <h1>BYTESIZE&nbsp;AI</h1>
    <p>Free AI tools, explained in 60 seconds.</p>
  </div>
</body></html>
