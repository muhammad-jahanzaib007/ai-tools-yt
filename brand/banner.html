<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:2560px;height:1440px;overflow:hidden}
  body{background:radial-gradient(95% 130% at 50% 32%,#F6F2EA 0%,#EFE9DC 55%,#E7E0D0 100%);
    font-family:Georgia,'Times New Roman',serif;position:relative}
  .safe{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:1546px;height:423px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:30px;text-align:center}
  .mark{width:128px;height:128px;border-radius:34px;background:#D97757;position:relative;
    -webkit-mask:radial-gradient(circle 34px at 128px 0, transparent 33px, #000 34px);
            mask:radial-gradient(circle 34px at 128px 0, transparent 33px, #000 34px)}
  h1{font-size:138px;font-weight:700;letter-spacing:-2px;color:#1A1915;line-height:1}
  h1 .c{color:#D97757}
  p{font-size:40px;color:#75736B;font-style:italic;letter-spacing:.3px}
</style></head>
<body>
  <div class="safe">
    <div class="mark"></div>
    <h1>Snackbyte <span class="c">AI</span></h1>
    <p>Free AI tools, explained in 60 seconds.</p>
  </div>
</body></html>
