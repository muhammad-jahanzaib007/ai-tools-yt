name = "pipeline-heartbeat"
main = "worker.js"
compatibility_date = "2026-07-08"

# SINGLE FIRING SOURCE (2026-07-11): the repos have NO GitHub schedule crons;
# these triggers are the only schedule either pipeline has.
#   59 10,15,19 — YT publish slots (dispatch at the exact slot minute)
#   0 8,20      — blog slots
#   20,40       — retry sweeps: re-dispatch any slot still uncovered (a failed
#                 dispatch, a Cloudflare hiccup). Sweep minutes deliberately
#                 never coincide with slot minutes, and worker.js ignores
#                 slots younger than MIN_RETRY_MIN, so a sweep can never
#                 double-fire a fresh dispatch.
# Cloudflare allows 3 cron triggers per Worker — exactly these three.
[triggers]
crons = ["59 10,15,19 * * *", "0 8,20 * * *", "20,40 * * * *"]
